name: Finance Radar — daily brief

# Runs on GitHub's free tier. A private repo gets 2,000 Actions minutes a
# month; this job takes about 5, so roughly 150 a month. Nothing to pay.
on:
  schedule:
    # GitHub cron is UTC only. 20:30 Bangladesh time = 14:30 UTC.
    #
    # Scheduled runs on the free tier are BEST EFFORT: GitHub queues them
    # behind paid usage and, under load, delays them by an hour or drops them
    # entirely. A single firing is therefore not reliable enough to depend on.
    #
    # So we fire five times and let the job's own guard sort it out: if a
    # brief for today already exists, run_daily.py logs that and exits in
    # seconds without calling the model. Whichever firing gets through first
    # does the work; the rest cost a few seconds each and nothing else.
    - cron: "30 14 * * *"      # 20:30 Dhaka — the one we want
    - cron: "30 15 * * *"      # 21:30 — first safety net
    - cron: "30 16 * * *"      # 22:30 — last safety net
  workflow_dispatch:           # lets you run it by hand from the Actions tab
    inputs:
      force:
        description: "Rebuild today's brief even if one already exists"
        type: boolean
        default: false

# The job commits the database and briefs back to the repo, which is how the
# analyst's memory survives from one day to the next.
permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # GitHub's runners are on UTC. Without this, a run that GitHub delays past
    # 18:00 UTC computes yesterday's date in Dhaka terms, decides that brief
    # already exists, and exits having done nothing — which is exactly how
    # 2026-08-04 was lost. Dating the run in Dhaka time keeps the brief's date
    # and the reader's day the same thing.
    env:
      TZ: Asia/Dhaka

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build today's brief
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINRADAR_SMTP_USER: ${{ secrets.GMAIL_ADDRESS }}
          FINRADAR_SMTP_PASS: ${{ secrets.GMAIL_APP_PASSWORD }}
          FINRADAR_MAIL_TO: ${{ secrets.GMAIL_ADDRESS }}
        run: |
          # A brief is meant to summarise a day that has actually happened.
          # GitHub delays scheduled runs, and a firing that slips past midnight
          # would otherwise date itself to the new day and report the previous
          # day's news as if it were today's — which is exactly what happened
          # at 02:13 on 2026-08-05. If a scheduled run lands before the evening,
          # stop and leave the day's slot free for the 20:30 firing.
          HOUR=$(date +%-H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$HOUR" -lt 19 ]; then
            echo "It is only ${HOUR}:00 in Dhaka — too early to summarise today."
            echo "Leaving this day for the evening run."
            exit 0
          fi
          python run_daily.py --engine gemini_api \
            ${{ inputs.force && '--force' || '' }}

      - name: Save the brief and the memory back to the repo
        run: |
          git config user.name  "Finance Radar"
          git config user.email "actions@github.com"
          git add data/ logs/
          if git diff --staged --quiet; then
            echo "Nothing changed — not committing."
          else
            git commit -m "Brief for $(date -u +%Y-%m-%d)"
            # Another run may have pushed while this one was working.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi

      # Keeps the brief downloadable from the Actions run even if the commit
      # step fails, so a bad day never costs you the analysis.
      - name: Attach the brief to this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brief
          path: |
            data/briefs/
            data/dashboard.html
            data/cards/
            logs/error_*.txt
          if-no-files-found: warn
          retention-days: 30
